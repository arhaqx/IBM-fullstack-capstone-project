<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GiftLink Home</title>
    <meta name="description" content="GiftLink connects people giving away household items they no longer need with people who would rather reuse than buy new.">
    <link rel="icon" href="/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/home.css">
</head>
<body>
    <div class="container my-5">
        <div class="text-center content">
            <img src="/static/presents.svg" alt="" class="hero-icon" aria-hidden="true">

            <!-- Task 1: Add the main heading -->
                <h1 class="display-4">GiftLink</h1>

            <!-- Task 2: Add the subheading -->
                <h2 class="mb-4">Share Gifts, Share Joy</h2>

            <!-- Task 3: Add the inspirational quote -->
                <p class="lead">
                    "Sharing is the essence of community. Give the things you no longer need
                    a second home — and help your neighbours find exactly what they were looking for."
                </p>

            <!-- Task 4: Add the 'Get Started' button -->
                <a href="/app" class="btn btn-primary btn-lg" id="get-started">Get Started</a>
        </div>
    </div>
</body>
</html>
